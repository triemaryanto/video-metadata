<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Pembaca Metadata Video</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; color: #1a1a1a; }
    h1 { font-size: 1.5rem; }
    .drop { border: 2px dashed #999; border-radius: 12px; padding: 40px; text-align: center; }
    input[type=file] { margin: 16px 0; }
    button { background: #1a1a1a; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    button:hover { background: #333; }
    p.hint { color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Unggah Video untuk Baca Metadata</h1>
  <form class="drop" action="/upload" method="post" enctype="multipart/form-data">
    <p>Pilih file video (mp4, mov, mkv, avi, webm, dll — maks 500 MB)</p>
    <input type="file" name="video" accept="video/*" required>
    <br>
    <button type="submit">Unggah &amp; Baca Metadata</button>
  </form>
  <p class="hint">File akan dihapus dari server segera setelah metadata dibaca.</p>
</body>
</html>
